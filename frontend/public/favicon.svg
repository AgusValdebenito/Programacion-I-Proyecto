<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="frBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#641cc4" />
      <stop offset="100%" stop-color="#32105f" />
    </linearGradient>
    <linearGradient id="frYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe033" />
      <stop offset="100%" stop-color="#ff9d00" />
    </linearGradient>
    <filter id="frShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fondo squircle redondeado con degradado morado de marca FoodRush -->
  <rect width="64" height="64" rx="16" fill="url(#frBg)" />

  <!-- Bolsa de delivery gastronómica -->
  <!-- Manija de la bolsa en dorado Rush -->
  <path d="M24 21 C24 13.5, 40 13.5, 40 21" fill="none" stroke="url(#frYellow)" stroke-width="4" stroke-linecap="round" />

  <!-- Cuerpo de la bolsa de delivery con sombra sutil -->
  <path d="M16 21 L19.2 49.5 C19.6 52.8 22 54.5 25.5 54.5 H38.5 C42 54.5 44.4 52.8 44.8 49.5 L48 21 Z" fill="#ffffff" filter="url(#frShadow)" />
  
  <!-- Solapa superior plegada -->
  <path d="M15 21 L49 21 L46.5 24.5 L17.5 24.5 Z" fill="#e8e8ed" />

  <!-- Campana gourmet en el centro de la bolsa -->
  <!-- Plato base del cloche -->
  <rect x="23" y="44" width="18" height="2.5" rx="1.2" fill="url(#frYellow)" />
  
  <!-- Cúpula de la campana gourmet en morado FoodRush -->
  <path d="M24.5 42 C24.5 32, 39.5 32, 39.5 42 Z" fill="#4b1694" />
  
  <!-- Pomo superior de la campana -->
  <circle cx="32" cy="30.5" r="2" fill="url(#frYellow)" />

  <!-- Ondas de aroma y velocidad FoodRush -->
  <path d="M29 25.5 C28 23.5, 30 22, 29 20" stroke="url(#frYellow)" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <path d="M33 24.5 C32 22.5, 34 21, 33 19" stroke="url(#frYellow)" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <path d="M37 25.5 C36 23.5, 38 22, 37 20" stroke="url(#frYellow)" stroke-width="1.6" stroke-linecap="round" fill="none" />
</svg>
